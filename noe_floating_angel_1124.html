<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>希音へのとくべつなお手紙</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 22px 18px 48px;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
  color: #51443e; text-align: center;
  background: linear-gradient(180deg, #fffdf8 0%, #fff8f4 48%, #eaf4ff 100%);
}
.wrap { max-width: 560px; margin: 0 auto; }
.angel {
  display: block; width: min(220px, 58vw); height: auto;
  margin: 0 auto 4px; border-radius: 24px;
  animation: float 2.8s ease-in-out infinite;
  filter: drop-shadow(0 12px 10px rgba(100,110,130,.14));
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-18px) rotate(1deg); }
}
.sparkle {
  color: #f3c95c; font-size: 22px; letter-spacing: 12px;
  animation: twinkle 1.8s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
h1 { font-size: 26px; font-weight: 650; margin: 8px 0 10px; }
.lead { color: #93857e; margin: 0 0 22px; }
.panel {
  background: rgba(255,255,255,.94); border: 3px dashed #b6cde7;
  border-radius: 28px; padding: 28px 22px; margin: 20px auto;
  box-shadow: 0 8px 24px rgba(150,180,210,.17);
}
input {
  width: min(240px, 85%); padding: 14px 12px; border: 2px solid #c6d9ed;
  border-radius: 14px; font-size: 20px; text-align: center;
  color: #51443e; background: white;
}
button {
  display: block; margin: 16px auto 2px; padding: 13px 36px;
  border: 0; border-radius: 30px; background: #a9c9eb; color: white;
  font-size: 18px; font-weight: 700;
}
button:active { transform: scale(.97); }
#error { min-height: 24px; color: #d87883; margin: 12px 0 0; }
#message { display: none; }
h2 { font-size: 22px; margin: 0 0 20px; }
#messageText {
  color: #51443e; font-size: 16px; line-height: 2.05;
  text-align: left; white-space: pre-line; overflow-wrap: anywhere;
}
.foot { color: #999; font-size: 14px; margin-top: 26px; }
@media (prefers-reduced-motion: reduce) {
  .angel, .sparkle { animation: none; }
}
</style>
</head>

  <h1>メッセージをひらく</h1>
  <p class="lead">特別な番号を入力してね</p>

  <div class="panel" id="entryPanel">
    <form id="unlockForm">
      <input id="code" type="text" inputmode="numeric" autocomplete="off"
             maxlength="4" placeholder="番号を入力" aria-label="番号を入力">
      <button type="submit">ひらく　▶</button>
    </form>
    <p id="error" aria-live="polite"></p>
  </div>

  <section class="panel" id="message" aria-live="polite">
    <h2>💌 あなたへのメッセージ</h2>
    <div id="messageText"></div>
  </section>
  <p class="foot">あなたへの とくべつな おてがみ</p>
</div>

<script>
const ACCESS_NUMBER = "1124";
const MESSAGE = `希音お誕生日おめでとう！！
最近はラインとかでたくさん話せて本当に楽しい！ねねのこれからをずっと応援してます！！
今回は写真をプレゼントしました。これは僕の大切な思い出です。ねねにも忘れて欲しくないなと思って渡しました！！
このQRコードは親にバレないように隠しといてね笑笑
いい人生になりますように！いい一年にしてね！`;

document.getElementById("unlockForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const entered = document.getElementById("code").value.trim();
  const error = document.getElementById("error");
  const message = document.getElementById("message");

  if (entered === ACCESS_NUMBER) {
    error.textContent = "";
    document.getElementById("messageText").textContent = MESSAGE;
    document.getElementById("entryPanel").style.display = "none";
    message.style.display = "block";
    message.scrollIntoView({ behavior: "smooth", block: "center" });
  } else {
    message.style.display = "none";
    error.textContent = "ばんごうがちがうみたい。もういちどためしてね！";
  }
});
</script>
